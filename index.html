  * {

    height: 100%;

    touch-action: none;
    overscroll-behavior: none;
  }
  
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px;
    padding-bottom: env(safe-area-inset-bottom, 6px);
  }
  
  header {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  h1 {
    font-family: 'Press Start 2P', system-ui, monospace;
    font-size: 15px;
    margin: 4px 0 2px;
    color: #ffb347;
    text-shadow: 0 0 10px #ff8c00, 0 0 2px #ff8c00;
    letter-spacing: 1px;
    line-height: 1.35;
  }
  
  .hud {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 12px;

    display: flex;
    gap: 8px 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 800px;

    letter-spacing: 0;
    box-sizing: border-box;
  }

    white-space: nowrap;

  .hud .combo { color: #ff6b6b; }
  
  #statusBar {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 20px;
    align-items: center;
    box-sizing: border-box;
    flex-shrink: 0;

  }
  
  .top-btns {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 28px;
    height: 28px;

    min-height: 0;
    min-width: 0;

  return base;

  if(level%5===0){

    do{ bx=10+Math.floor(Math.random()*(COLS-20)); by=10+Math.floor(Math.random()*(ROWS-20)); }while(field[by][bx]!==EMPTY);
    const sp = getEnemySpeed('tank')*0.7; // Босс стал медленнее
    boss={x:bx,y:by,vx:sp,vy:sp,hp:4+level*1,maxHp:4+level*1,r:1.35,flash:0,phased:false}; // Босс стал слабее
  }
}

function resetLevel(){

  spawnEnemies(cnt);
  percent=0; combo=1; comboTimer=0;
  updateUI();
}

function calcPercent(){
  let claimed=0, total=0;
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++){ if(field[y][x]!==ROCK) total++; if(field[y][x]===CLAIMED) claimed++; }
  percent=Math.floor(claimed/total*100); return percent;
}

function addGold(area){
  const earned = Math.max(1, Math.floor(area * 0.8 * combo));
  gold += earned; localStorage.setItem('hamster_gold', gold); stats.totalCells += area;
  const prevCombo = combo; combo = Math.min(combo + 0.3, 5);
  if(combo > stats.bestCombo) stats.bestCombo = combo;
  if(Math.floor(combo) > Math.floor(prevCombo) && combo >= 2) comboBanner = 45;
  comboTimer = 160; lastClaim = area;
  floatTexts.push({ x: player.x * CELL + CELL / 2, y: player.y * CELL, text: '+' + earned + ' 🪙' + (combo >= 2 ? ' x' + combo.toFixed(1) : ''), life: 50, max: 50, color: '#ffd700' });
  checkAchievements(); saveStats(); updateUI(); return earned;
}

function saveStats(){ localStorage.setItem('hamster_stats',JSON.stringify(stats)); }
function updateUI(){
  document.getElementById('gold').textContent = gold;
  document.getElementById('combo').textContent = 'x' + combo.toFixed(1);
  document.getElementById('percent').textContent = percent + '%';
  document.getElementById('lives').textContent = lives;
  document.getElementById('level').textContent = level;
}

function spawnParticles(x,y,color,count=8){
  for(let i=0;i<count;i++){ const a=Math.random()*Math.PI*2, sp=0.3+Math.random()*1.8; particles.push({x:x*CELL+CELL/2,y:y*CELL+CELL/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18+Math.random()*15,max:35,color,size:1+Math.random()*2}); }
}
function spawnSpark(x,y){ sparks.push({x:x*CELL+CELL/2+(Math.random()-0.5)*5, y:y*CELL+CELL/2+(Math.random()-0.5)*5, life:14+Math.random()*10, max:25, size:0.8+Math.random()*1.2}); }

function clearAllTrails(){
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(field[y][x]===TRAIL) field[y][x]=EMPTY;
}

function closeTrail(){
  if(!trail || trail.length<2){
    if(trail) for(const p of trail) if(field[p.y]?.[p.x]===TRAIL) field[p.y][p.x]=EMPTY;
    trail=[]; player.drawing=false; clearAllTrails(); return;
  }
  for(const p of trail) field[p.y][p.x]=CLAIMED;

  const reachable=Array.from({length:ROWS},()=>Array(COLS).fill(false)); const q=[];
  for(const e of enemies){ const cx=Math.floor(e.x),cy=Math.floor(e.y); if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS&&field[cy][cx]===EMPTY){ q.push([cx,cy]); reachable[cy][cx]=true; } }
  
  while(q.length){
    const [x,y]=q.shift();
    for(let d=0;d<4;d++){ const nx=x+DX[d],ny=y+DY[d]; if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!reachable[ny][nx]&&field[ny][nx]===EMPTY){ reachable[ny][nx]=true; q.push([nx,ny]); } }
  }
  let claimedCells=0; const list=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){ if(field[y][x]===EMPTY && !reachable[y][x]){ field[y][x]=CLAIMED; claimedCells++; list.push([x,y]); } }
  if(list.length){
    const cx=list.reduce((s,p)=>s+p[0],0)/list.length, cy=list.reduce((s,p)=>s+p[1],0)/list.length;
    list.sort((a,b)=>((a[0]-cx)**2+(a[1]-cy)**2)-((b[0]-cx)**2+(b[1]-cy)**2));
    list.forEach((p,i)=>fillQueue.push({x:p[0],y:p[1],delay:Math.floor(i/10)}));
  }
  if(claimedCells>0){
    const big=claimedCells>35; sfxClaim(big); vibrate(big?50:20); addGold(claimedCells);
    for(let i=0;i<Math.min(5,Math.floor(claimedCells/12));i++){ const [cx,cy]=list[Math.floor(Math.random()*list.length)]; spawnParticles(cx,cy, theme.particle[Math.random()<0.5?0:1], big?12:7); }
    if(boss){
      const bx = Math.floor(boss.x), by = Math.floor(boss.y); let hit = false;
      let crushed = field[by] && field[by][bx] === CLAIMED;
      if(crushed) hit = true;
      if(!hit && claimedCells >= 20){ for(const [lx,ly] of list){ if(Math.abs(lx-bx)+Math.abs(ly-by) <= 4){ hit = true; break; } } }
      if(hit){
        const dmg = crushed ? Math.min(boss.hp, 3 + Math.floor(claimedCells / 25)) : Math.min(boss.hp, 1 + Math.floor(claimedCells / 50));
        boss.hp -= dmg; boss.flash = 10;
        floatTexts.push({ x: boss.x*CELL+CELL/2, y: boss.y*CELL - 10, text: '💥 -'+dmg, life: 55, max: 55, color: '#ff5252' });
        shake = 10; sfxMine();
        if(crushed && boss.hp > 0){
          let placed = false;
          for(let r=1;r<12 && !placed;r++){
            for(let dy=-r;dy<=r && !placed;dy++) for(let dx=-r;dx<=r && !placed;dx++){ const nx=bx+dx, ny=by+dy; if(nx>1&&nx<COLS-2&&ny>1&&ny<ROWS-2&&field[ny][nx]===EMPTY){ boss.x=nx; boss.y=ny; placed=true; } }
          }
        }
        if(boss.hp <= boss.maxHp/2 && !boss.phased){
            boss.phased = true;
            enemies.push({x: boss.x, y: boss.y, vx: getEnemySpeed('normal'), vy: -getEnemySpeed('normal'), type: 'fast', hp: 1});
            enemies.push({x: boss.x, y: boss.y, vx: -getEnemySpeed('normal'), vy: getEnemySpeed('normal'), type: 'fast', hp: 1});
            spawnParticles(boss.x, boss.y, '#fff', 15);
            floatTexts.push({x: boss.x*CELL, y: boss.y*CELL-20, text: 'РАЗДВОЕНИЕ!', life: 60, max:60, color:'#ffeb3b'});
        }
        if(boss.hp <= 0){
          stats.bossKills++; saveStats(); const bonus = 100 + level * 15; gold += bonus; localStorage.setItem('hamster_gold', gold);
          floatTexts.push({x: bx*CELL+CELL/2, y: by*CELL, text: '👾 BOSS DOWN! +' + bonus + ' 🪙', life: 70, max: 70, color: '#ffd700'});
          spawnParticles(bx, by, '#ff5252', 20); boss = null; updateUI();
        }
      }
    }
  }
  trail=[]; player.drawing=false; bgDirty=true;
  clearAllTrails(); percent=calcPercent(); updateUI(); checkWin();
}

function updateContinuous(dt){
  for(const e of enemies){
    if(e.type === 'hunter' && player.drawing && trail.length > 0){
        let dx = player.x - e.x; let dy = player.y - e.y; let dist = Math.hypot(dx, dy);
        // Хищник теперь поворачивает медленнее
        if(dist > 0){ let s = getEnemySpeed('hunter'); e.vx += ((dx/dist)*s - e.vx) * dt * 1.5; e.vy += ((dy/dist)*s - e.vy) * dt * 1.5; }
    }
    
    let speedScale = dt * 12; 
    let nx = e.x + e.vx * speedScale; let ny = e.y + e.vy * speedScale;
    
    const solid=(x,y)=>{
      const cx=Math.floor(x), cy=Math.floor(y);
      if(cx<1||cx>=COLS-1||cy<1||cy>=ROWS-1) return true;
      const v=field[cy]?.[cx]; return v===CLAIMED||v===BORDER||v===ROCK;
    };
    if(solid(nx,e.y)){ e.vx*=-1; nx=e.x+e.vx*speedScale; }
    if(solid(e.x,ny)){ e.vy*=-1; ny=e.y+e.vy*speedScale; }
    if(solid(nx,ny)){ e.vx*=-1; e.vy*=-1; nx=e.x+e.vx*speedScale; ny=e.y+e.vy*speedScale; }
    e.x=nx; e.y=ny;
    
    const tcx=Math.floor(e.x),tcy=Math.floor(e.y);
    if(tcx>=0&&tcx<COLS&&tcy>=0&&tcy<ROWS && field[tcy][tcx]===TRAIL){
      if (!document.getElementById('godModeToggle').checked) {
        die(); return;
      }
    }
    
    if(e.type==='miner' && Math.random()<0.0035){
      const mx=Math.floor(e.x),my=Math.floor(e.y);
      if(mx>1&&mx<COLS-2&&my>1&&my<ROWS-2&&field[my][mx]===EMPTY) mines.push({x:mx,y:my,timer:160+Math.random()*50|0});
    }
  }

  if(boss){
    let speedScale = dt * 12;
    let nx=boss.x+boss.vx*speedScale, ny=boss.y+boss.vy*speedScale;
    const solid=(x,y)=>{ const cx=Math.floor(x),cy=Math.floor(y); if(cx<2||cx>=COLS-2||cy<2||cy>=ROWS-2) return true; const v=field[cy]?.[cx]; return v===CLAIMED||v===BORDER||v===ROCK; };
    if(solid(nx,boss.y)) boss.vx*=-1;
    if(solid(boss.x,ny)) boss.vy*=-1;
    boss.x+=boss.vx*speedScale; boss.y+=boss.vy*speedScale;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const cx=Math.floor(boss.x)+dx, cy=Math.floor(boss.y)+dy;
      if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS && field[cy][cx]===TRAIL){ 
        if (!document.getElementById('godModeToggle').checked) {
          die(); return; 
        }
      }
    }
  }
}

function tryMove(dir){
  const nx=player.x+DX[dir], ny=player.y+DY[dir];
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return false;
  const cell=field[ny][nx];
  if(cell===TRAIL || cell===ROCK) return false;

  if(cell===CLAIMED||cell===BORDER){
    if(player.drawing && trail.length>0) closeTrail();
    player.x=nx; player.y=ny; player.drawing=false;
  } else {
    if(!player.drawing){ player.drawing=true; trail=[]; }
    if(field[player.y][player.x]===EMPTY){ field[player.y][player.x]=TRAIL; trail.push({x:player.x,y:player.y}); spawnSpark(player.x,player.y); }
    player.x=nx; player.y=ny;
    if(field[ny][nx]===EMPTY){ field[ny][nx]=TRAIL; trail.push({x:nx,y:ny}); spawnSpark(nx,ny); if(Math.random()<0.4) spawnSpark(nx,ny); }
  }
  player.dir=dir; player.moving=true;

  for(let i=goldCoins.length-1;i>=0;i--){
    if(goldCoins[i].x===player.x && goldCoins[i].y===player.y){
      const bonus = Math.floor(25 * combo); gold += bonus; localStorage.setItem('hamster_gold', gold);
      spawnParticles(player.x,player.y,'#ffd700',14); vibrate(20); showAchPopup('🪙 +' + bonus);
      goldCoins.splice(i,1); goldCoinCooldown=450+Math.random()*400; updateUI();
    }
  }
  return true;
}

function renderStaticBackground() {
  if(!bgDirty) return;
  bgCtx.fillStyle = theme.bg; bgCtx.fillRect(0,0,W,H);
  
  for(let y=0;y<ROWS;y++) {
    for(let x=0;x<COLS;x++) {
      const v = field[y][x];
      if(v===CLAIMED){
        bgCtx.fillStyle=theme.claimed(level); bgCtx.fillRect(x*CELL,y*CELL,CELL,CELL);
        if((x + y) % 2 === 0){ bgCtx.fillStyle='rgba(255,255,255,0.035)'; bgCtx.fillRect(x*CELL,y*CELL,CELL,CELL); }
        bgCtx.fillStyle='rgba(255,255,255,0.06)'; bgCtx.fillRect(x*CELL,y*CELL,CELL,1);
      } else if(v===BORDER){
        const g = bgCtx.createLinearGradient(x*CELL,y*CELL,x*CELL+CELL,y*CELL+CELL);
        g.addColorStop(0, theme.border); g.addColorStop(1, '#0a0a12');
        bgCtx.fillStyle=g; bgCtx.fillRect(x*CELL,y*CELL,CELL,CELL);
        bgCtx.fillStyle='rgba(255,255,255,0.08)'; bgCtx.fillRect(x*CELL+1,y*CELL+1,CELL-2,1);
      } else if(v===ROCK){
        bgCtx.fillStyle='#4e342e'; bgCtx.fillRect(x*CELL,y*CELL,CELL,CELL);
        bgCtx.fillStyle='#3e2723'; bgCtx.fillRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4);
        bgCtx.fillStyle='#795548'; bgCtx.fillRect(x*CELL,y*CELL,2,2);
      }
    }
  }
  bgDirty = false;
}

function drawForeground(){
  // Очистка со сбросом трансформации для фикса остаточных изображений (призраков) на краях
  fgCtx.setTransform(1, 0, 0, 1, 0, 0);
  fgCtx.clearRect(0,0,W,H);
  const tnow = performance.now();

  for(const s of bgStars){
    s.tw += 0.03; const alpha = s.a * (0.55 + 0.45*Math.sin(s.tw));
    fgCtx.globalAlpha = alpha; fgCtx.fillStyle = theme.spark || '#fff';
    fgCtx.beginPath(); fgCtx.arc(s.x, s.y, s.s, 0, Math.PI*2); fgCtx.fill();
    s.y += s.sp * 0.15; if(s.y > H){ s.y = 0; s.x = Math.random()*W; }
  }
  fgCtx.globalAlpha = 1;

  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(field[y][x]===TRAIL){
      fgCtx.fillStyle=theme.trail; fgCtx.shadowColor=theme.trail; fgCtx.shadowBlur=6;
      fgCtx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2); fgCtx.shadowBlur=0;
      fgCtx.fillStyle='#5d4037'; fgCtx.beginPath(); fgCtx.ellipse(x*CELL+CELL/2, y*CELL+CELL/2, 2.2, 1.3, (x+y)%2===0?0.5:-0.5, 0, Math.PI*2); fgCtx.fill();
      fgCtx.fillStyle='#fff8e1'; fgCtx.beginPath(); fgCtx.arc(x*CELL+CELL/2, y*CELL+CELL/2, 0.7, 0, Math.PI*2); fgCtx.fill();
    }
  }

  for(const m of mines){
    const pulse=0.55+Math.sin(tnow/110)*0.4; fgCtx.globalAlpha=pulse; fgCtx.fillStyle='#ff5722';
    fgCtx.beginPath(); fgCtx.arc(m.x*CELL+CELL/2,m.y*CELL+CELL/2,5,0,Math.PI*2); fgCtx.fill();
    fgCtx.fillStyle='#ffeb3b'; fgCtx.beginPath(); fgCtx.arc(m.x*CELL+CELL/2,m.y*CELL+CELL/2,2.2,0,Math.PI*2); fgCtx.fill(); fgCtx.globalAlpha=1;
  }

  for(const g of goldCoins){
    const gx=g.x*CELL+CELL/2, gy=g.y*CELL+CELL/2, bob = Math.sin(tnow/120)*2.5;
    fgCtx.globalAlpha=0.75+Math.sin(tnow/100)*0.25; fgCtx.shadowColor='#ffd700'; fgCtx.shadowBlur=10;
    fgCtx.font='16px serif'; fgCtx.textAlign='center'; fgCtx.textBaseline='middle'; fgCtx.fillText('🪙',gx,gy+bob); fgCtx.shadowBlur=0; fgCtx.globalAlpha=1;
  }

  for(const e of enemies){
    const wiggle = Math.sin(tnow/120 + e.x*3)*1.2;
    const ex=e.x*CELL+CELL/2 + wiggle, ey=e.y*CELL+CELL/2;
    const r=e.type==='tank'?CELL*0.48:e.type==='fast'?CELL*0.32:CELL*0.4;
    let col=theme.enemy[e.type==='fast'?1:e.type==='tank'?2:0];
    if(e.type === 'hunter') col = '#e65100'; 
    fgCtx.fillStyle='rgba(0,0,0,0.35)'; fgCtx.beginPath(); fgCtx.ellipse(ex+1,ey+2,r*0.9,r*0.5,0,0,Math.PI*2); fgCtx.fill();
    fgCtx.fillStyle=col; fgCtx.beginPath(); fgCtx.arc(ex,ey,r,0,Math.PI*2); fgCtx.fill();
    fgCtx.fillStyle='rgba(255,255,255,0.25)'; fgCtx.beginPath(); fgCtx.arc(ex-r*0.25,ey-r*0.3,r*0.28,0,Math.PI*2); fgCtx.fill();
    fgCtx.fillStyle='#fff'; fgCtx.beginPath(); fgCtx.arc(ex-r*0.28,ey-r*0.1,r*0.2,0,Math.PI*2); fgCtx.arc(ex+r*0.28,ey-r*0.1,r*0.2,0,Math.PI*2); fgCtx.fill();
    fgCtx.fillStyle='#111'; fgCtx.beginPath(); fgCtx.arc(ex-r*0.28,ey-r*0.08,r*0.1,0,Math.PI*2); fgCtx.arc(ex+r*0.28,ey-r*0.08,r*0.1,0,Math.PI*2); fgCtx.fill();
    if(e.type==='tank'){ fgCtx.strokeStyle='rgba(0,0,0,0.4)'; fgCtx.lineWidth=2; fgCtx.beginPath(); fgCtx.arc(ex,ey,r*0.7,0,Math.PI*2); fgCtx.stroke(); }
    else if(e.type==='fast'){ fgCtx.fillStyle='rgba(255,255,100,0.5)'; fgCtx.fillRect(ex-r-4,ey-1,3,2); }
    else if(e.type==='miner'){ fgCtx.fillStyle='#ff9800'; fgCtx.beginPath(); fgCtx.arc(ex,ey+r*0.55,2,0,Math.PI*2); fgCtx.fill(); }
    else if(e.type==='hunter'){ fgCtx.fillStyle='#ffeb3b'; fgCtx.beginPath(); fgCtx.moveTo(ex, ey-r); fgCtx.lineTo(ex+4, ey-r-6); fgCtx.lineTo(ex-4, ey-r-6); fgCtx.fill(); }
  }

  if(boss){
    const ex=boss.x*CELL+CELL/2, ey=boss.y*CELL+CELL/2, r=CELL*boss.r;
    const pulse = 1 + Math.sin(tnow/200)*0.04;
    fgCtx.fillStyle='rgba(0,0,0,0.4)'; fgCtx.beginPath(); fgCtx.ellipse(ex+2,ey+3,r*0.95*pulse,r*0.55,0,0,Math.PI*2); fgCtx.fill();
    if(boss.flash > 0){ boss.flash--; fgCtx.fillStyle='#ffffff'; } else { fgCtx.fillStyle='#d50000'; }
    fgCtx.beginPath(); fgCtx.arc(ex,ey,r*pulse,0,Math.PI*2); fgCtx.fill();
    fgCtx.strokeStyle='#ff8a80'; fgCtx.lineWidth=2.5; fgCtx.stroke();
    fgCtx.fillStyle='#fff'; fgCtx.beginPath(); fgCtx.arc(ex-r*0.35,ey-r*0.15,r*0.22,0,Math.PI*2); fgCtx.arc(ex+r*0.35,ey-r*0.15,r*0.22,0,Math.PI*2); fgCtx.fill();
    fgCtx.fillStyle='#000'; fgCtx.beginPath(); fgCtx.arc(ex-r*0.35,ey-r*0.1,r*0.1,0,Math.PI*2); fgCtx.arc(ex+r*0.35,ey-r*0.1,r*0.1,0,Math.PI*2); fgCtx.fill();
    fgCtx.fillStyle='#222'; fgCtx.fillRect(ex-20,ey-r-12,40,5); fgCtx.fillStyle='#f44336'; fgCtx.fillRect(ex-20,ey-r-12,40*(boss.hp/boss.maxHp),5);
    fgCtx.strokeStyle='#fff'; fgCtx.lineWidth=1; fgCtx.strokeRect(ex-20,ey-r-12,40,5);
  }

  let lerpOffset = player.moving ? 1 - (stepTimer / STEP_DELAY) : 0;
  let px = player.x - DX[player.dir] * lerpOffset;
  let py = player.y - DY[player.dir] * lerpOffset;
  
  if(shake>0){ fgCtx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.88; if(shake<0.4) shake=0; }

  const skin = SKINS.find(s=>s.id===selectedSkin)||SKINS[0];
  drawChar(px, py, player.dir, skin.body, skin.ear, true, skin.hat);

  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.life--; if(s.life<=0){sparks.splice(i,1);continue;}
    fgCtx.globalAlpha=s.life/s.max; fgCtx.fillStyle=theme.spark; fgCtx.beginPath(); fgCtx.arc(s.x,s.y,s.size*(s.life/s.max),0,Math.PI*2); fgCtx.fill();
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life--; if(p.life<=0){particles.splice(i,1);continue;}
    fgCtx.globalAlpha=p.life/p.max; fgCtx.fillStyle=p.color; fgCtx.beginPath(); fgCtx.arc(p.x,p.y,p.size*(p.life/p.max),0,Math.PI*2); fgCtx.fill();
  }
  fgCtx.globalAlpha=1;

  fgCtx.textAlign='center'; fgCtx.textBaseline='middle';
  for(let i=floatTexts.length-1;i>=0;i--){
    const f=floatTexts[i]; f.y -= 0.9; f.life--; if(f.life<=0){ floatTexts.splice(i,1); continue; }
    fgCtx.globalAlpha = f.life/f.max; fgCtx.font = 'bold 12px "Press Start 2P", monospace';
    fgCtx.fillStyle = f.color; fgCtx.strokeStyle = '#000'; fgCtx.lineWidth = 3;
    fgCtx.strokeText(f.text, f.x, f.y); fgCtx.fillText(f.text, f.x, f.y);
  }
  fgCtx.globalAlpha=1;

  if(comboBanner > 0){
    const a = Math.min(1, comboBanner/15) * Math.min(1, (45-comboBanner)/8);
    fgCtx.globalAlpha = a * 0.9; fgCtx.font = 'bold 18px "Press Start 2P", monospace'; fgCtx.textAlign = 'center';
    fgCtx.fillStyle = '#ff6b6b'; fgCtx.strokeStyle = '#000'; fgCtx.lineWidth = 4;
    const txt = '🔥 x' + combo.toFixed(1); fgCtx.strokeText(txt, W/2, H*0.28); fgCtx.fillText(txt, W/2, H*0.28); fgCtx.globalAlpha = 1;
  }

  if(dangerLevel > 0){
    const pulse = 0.5 + 0.5 * Math.sin(tnow / 80);
    const dvig = fgCtx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.75);
    dvig.addColorStop(0, 'rgba(255,0,0,0)'); dvig.addColorStop(1, `rgba(255,20,20,${dangerLevel * 0.45 * pulse})`);
    fgCtx.fillStyle = dvig; fgCtx.fillRect(0,0,W,H);
  }
}

  fgCtx.fillStyle=body; fgCtx.beginPath(); fgCtx.ellipse(cx, cy+1, CELL*0.42, CELL*0.38, 0,0,Math.PI*2); fgCtx.fill();
  fgCtx.fillStyle='rgba(255,255,255,0.18)'; fgCtx.beginPath(); fgCtx.ellipse(cx-2, cy-2, CELL*0.18, CELL*0.14, -0.4, 0, Math.PI*2); fgCtx.fill();
  fgCtx.fillStyle=ear; fgCtx.beginPath(); fgCtx.arc(cx-4.8, cy-5.8, 3.8, 0, Math.PI*2); fgCtx.arc(cx+4.8, cy-5.8, 3.8, 0, Math.PI*2); fgCtx.fill();
  fgCtx.fillStyle='#ffccbb'; fgCtx.beginPath(); fgCtx.arc(cx-4.8, cy-5.8, 2.0, 0, Math.PI*2); fgCtx.arc(cx+4.8, cy-5.8, 2.0, 0, Math.PI*2); fgCtx.fill();
  if(hasHat){ fgCtx.fillStyle='#c62828'; fgCtx.beginPath(); fgCtx.ellipse(cx, cy-7.5, 6.5, 3.8, 0,0,Math.PI*2); fgCtx.fill(); fgCtx.fillStyle='#b71c1c'; fgCtx.fillRect(cx-6.5, cy-8, 13, 2.5); fgCtx.fillStyle='#fff'; fgCtx.beginPath(); fgCtx.arc(cx, cy-11, 2.4, 0, Math.PI*2); fgCtx.fill(); fgCtx.fillStyle='rgba(255,255,255,0.5)'; fgCtx.beginPath(); fgCtx.arc(cx-0.6, cy-11.5, 0.9, 0, Math.PI*2); fgCtx.fill(); }
  fgCtx.fillStyle='#ffe4c4'; fgCtx.beginPath(); fgCtx.ellipse(cx, cy+2.8, 3.9, 3.2, 0,0,Math.PI*2); fgCtx.fill();
  const blink = (isPlayer && Math.floor(tnow/3000)%12===0) ? 0.15 : 1;

  if(blink > 0.5){ fgCtx.fillStyle='#fff'; fgCtx.beginPath(); fgCtx.arc(cx-1.9+ox, cy+0.3+oy, 0.45, 0, Math.PI*2); fgCtx.arc(cx+2.5+ox, cy+0.3+oy, 0.45, 0, Math.PI*2); fgCtx.fill(); }
  fgCtx.fillStyle='#c07050'; fgCtx.beginPath(); fgCtx.arc(cx+ox*1.3, cy+3.5+oy, 1.3, 0, Math.PI*2); fgCtx.fill();
  fgCtx.fillStyle='rgba(255,200,180,0.5)'; fgCtx.beginPath(); fgCtx.arc(cx+ox*1.3-0.3, cy+3.3+oy, 0.45, 0, Math.PI*2); fgCtx.fill();
  fgCtx.fillStyle='rgba(255,150,150,0.35)'; fgCtx.beginPath(); fgCtx.arc(cx-3.5, cy+3.5, 1.6, 0, Math.PI*2); fgCtx.arc(cx+3.5, cy+3.5, 1.6, 0, Math.PI*2); fgCtx.fill();
  if(isPlayer && player.moving){ const paw = Math.sin(animPhase)*2.4; fgCtx.fillStyle=body; fgCtx.beginPath(); fgCtx.ellipse(cx-4.2, cy+6.2+paw, 2.2, 1.6, 0,0,Math.PI*2); fgCtx.fill(); fgCtx.beginPath(); fgCtx.ellipse(cx+4.2, cy+6.2-paw, 2.2, 1.6, 0,0,Math.PI*2); fgCtx.fill(); } 
  else { fgCtx.fillStyle=body; fgCtx.beginPath(); fgCtx.ellipse(cx-4, cy+6.5, 2, 1.4, 0,0,Math.PI*2); fgCtx.fill(); fgCtx.beginPath(); fgCtx.ellipse(cx+4, cy+6.5, 2, 1.4, 0,0,Math.PI*2); fgCtx.fill(); }
}

function loop(now){
  if (!lastTime) lastTime = now / 1000;
  let dt = (now / 1000) - lastTime;
  if(dt > 0.1) dt = 0.1; 
  lastTime = now / 1000;

  if(gameState==='play'){
    animPhase += dt * 15;
    if(comboTimer>0){ comboTimer -= dt * 60; if(comboTimer<=0) combo=Math.max(1,combo-0.35); }

    for(let i=fillQueue.length-1;i>=0;i--){ const f=fillQueue[i]; if(f.delay>0) f.delay--; else { spawnParticles(f.x,f.y,theme.particle[0],1); fillQueue.splice(i,1); } }

    goldCoinCooldown -= dt * 60;
    if(goldCoinCooldown<=0 && goldCoins.length===0){
      for(let tries=0;tries<20;tries++){
        const gx=2+Math.floor(Math.random()*(COLS-4)), gy=2+Math.floor(Math.random()*(ROWS-4));
        if(field[gy][gx]===EMPTY){ goldCoins.push({x:gx,y:gy,life:500}); break; }
      }
      goldCoinCooldown=550+Math.random()*400;
    }
    for(let i=goldCoins.length-1;i>=0;i--){ goldCoins[i].life -= dt * 60; if(goldCoins[i].life<=0) goldCoins.splice(i,1); }

    stepTimer += dt;
    while(stepTimer >= STEP_DELAY){
      let dir = -1;
      if(keys['ArrowRight']||keys['d']||keys['D']||keys['KeyD']||keys['в']||keys['В']) dir=0;
      else if(keys['ArrowDown']||keys['s']||keys['S']||keys['KeyS']||keys['ы']||keys['Ы']) dir=1;
      else if(keys['ArrowLeft']||keys['a']||keys['A']||keys['KeyA']||keys['ф']||keys['Ф']) dir=2;
      else if(keys['ArrowUp']||keys['w']||keys['W']||keys['KeyW']||keys['ц']||keys['Ц']) dir=3;
      if(dir < 0 && joyDir >= 0) dir = joyDir;

      if(dir!==-1){
        if(!tryMove(dir)) {
            player.moving = false;
        }
      } else {
        player.moving = false;
      }
      stepTimer -= STEP_DELAY;
    }

    updateContinuous(dt);

    if(player.drawing && trail.length > 0){
      let minDist = 999;
      for(const e of enemies){ for(let i=0; i<trail.length; i+=2){ const d = Math.hypot(e.x - trail[i].x, e.y - trail[i].y); if(d < minDist) minDist = d; } }
      if(boss){ for(let i=0; i<trail.length; i+=2){ const d = Math.hypot(boss.x - trail[i].x, boss.y - trail[i].y); if(d < minDist) minDist = d; } }
      dangerLevel = minDist < 3 ? Math.max(0, (3 - minDist) / 3) : 0; // Красный экран мигает чуть позже
    } else { dangerLevel = 0; }
  }
  
  renderStaticBackground();
  drawForeground();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown',e=>{
  keys[e.key]=true; if(e.code) keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyR'].includes(e.code) || ['w','a','s','d','W','A','S','D'].includes(e.key)) joyDir = -1;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key) || ['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
  if(e.key===' ' && gameState==='play') showPause();
  if((e.key==='r'||e.key==='R'||e.code==='KeyR')&&(gameState==='play'||gameState==='pause')){ resetLevel(); gameState='play'; setMenuMode(false); document.getElementById('overlay').classList.add('hidden'); lastTime = performance.now() / 1000; }
});
window.addEventListener('keyup',e=>{ keys[e.key]=false; if(e.code) keys[e.code]=false; });

let touchStartX = 0, touchStartY = 0;
const gameContainerHTML = document.getElementById('gameWrapper');
gameContainerHTML.addEventListener('touchstart', e => { initAudio(); if (e.touches.length === 1) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; } }, { passive: true });
gameContainerHTML.addEventListener('touchend', e => {
  if (e.changedTouches.length === 1) {
    const dx = e.changedTouches[0].clientX - touchStartX, dy = e.changedTouches[0].clientY - touchStartY, minSwipeDist = 20;
    if (Math.abs(dx) > minSwipeDist || Math.abs(dy) > minSwipeDist) {
        let dir = joyDir;
        const ratio = 1.2;
        if (joyDir === 0 || joyDir === 2) {
            if (Math.abs(dy) > Math.abs(dx) * ratio) dir = dy > 0 ? 1 : 3;
            else dir = dx > 0 ? 0 : 2;
        } else if (joyDir === 1 || joyDir === 3) {
            if (Math.abs(dx) > Math.abs(dy) * ratio) dir = dx > 0 ? 0 : 2;
            else dir = dy > 0 ? 1 : 3;
        } else {
            if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 0 : 2;
            else dir = dy > 0 ? 1 : 3;
        }
        joyDir = dir;
        swipeGuard = performance.now();
    } else {
        joyDir = -1; player.moving = false;
    }
  }
}, { passive: true });
gameContainerHTML.addEventListener('click', e=>{
  if(gameState!=='play') return;
  if(e.target.closest && (e.target.closest('.icon-btn')||e.target.closest('#overlay')||e.target.closest('#devPanel'))) return;
  const keyMoving = keys['ArrowRight']||keys['ArrowLeft']||keys['ArrowUp']||keys['ArrowDown']||keys['w']||keys['a']||keys['s']||keys['d']||keys['W']||keys['A']||keys['S']||keys['D']||keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD'];
  if(performance.now() - swipeGuard < 350) return; 
  if(!keyMoving){ joyDir = -1; player.moving = false; }
});

document.getElementById('musicBtn').onclick=()=>{ musicOn=!musicOn; localStorage.setItem('hamster_music', musicOn?'1':'0'); document.getElementById('musicBtn').textContent = musicOn?'🎵':'🚫'; if(musicOn) startMusic(); else stopMusic(); }; document.getElementById('musicBtn').textContent = musicOn?'🎵':'🚫';
document.getElementById('soundBtn').onclick=()=>{ soundOn=!soundOn; localStorage.setItem('hamster_sound', soundOn?'1':'0'); document.getElementById('soundBtn').textContent = soundOn?'🔊':'🔇'; if(soundOn) initAudio(); }; document.getElementById('soundBtn').textContent = soundOn?'🔊':'🔇';
document.getElementById('pauseBtn').onclick = () => { if (gameState === 'play') showPause(); else if (gameState === 'pause') { gameState = 'play'; document.getElementById('overlay').classList.add('hidden'); lastTime = performance.now() / 1000; } };

document.getElementById('devPrevLv').onclick = () => { if(gameState==='play' && level>1) { level--; resetLevel(); } };
document.getElementById('devNextLv').onclick = () => { if(gameState==='play') { level++; resetLevel(); } };

bindMenuButtons();
applyDevMode();
setMenuMode(true);
updateUI();
initField(); 
renderStaticBackground(); 
drawForeground();
