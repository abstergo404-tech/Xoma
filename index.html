<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Caveat:wght@600;700&display=swap');
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-font-smoothing: none;
    text-rendering: optimizeSpeed;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07070f;
    color: #e0e0e0;
    font-family: 'Press Start 2P', system-ui, monospace;
    touch-action: none;
    overscroll-behavior: none;
  }
  
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px;
    padding-bottom: env(safe-area-inset-bottom, 6px);
  }
  
  header {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  h1 {
    font-family: 'Press Start 2P', system-ui, monospace;
    font-size: 15px;
    margin: 5px 0 4px;
    color: #ffb347;
    text-shadow: 0 0 10px #ff8c00, 0 0 2px #ff8c00;
    letter-spacing: 1px;
    line-height: 1.35;
  }
  
  .hud {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 12px;
    font-weight: 600;
    margin: 4px auto 3px;
    color: #bbb;
    display: flex;
    gap: 8px 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 800px;
    line-height: 1.45;
    letter-spacing: 0;
    box-sizing: border-box;
  }
  .hud span {
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
  }
  .hud b { color: #7fff7f; font-weight: normal; }
  .hud .score { color: #ffd700; }
  .hud .combo { color: #ff6b6b; }
  
  #gameWrapper {
    flex: 1;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
    box-sizing: border-box;
  }
  
  #gameContainer {
    position: relative;
    border: 2px solid #3a3a50;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,140,0,.3);
    line-height: 0;
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    aspect-ratio: 4 / 3;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  /* Расширенное поле — чёрная область до кнопок, игра без искажений (4:3 contain) */
  body.expand-field {
    justify-content: flex-start;
  }
  body.expand-field header,
  body.expand-field #statusBar,
  body.expand-field #mobileControls {
    flex-shrink: 0;
  }
  body.expand-field #gameWrapper {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 800px;
    align-items: stretch;
    justify-content: stretch;
  }
  body.expand-field #gameContainer {
    aspect-ratio: auto;
    width: 100%;
    height: 100%;
    max-height: none;
    flex: 1 1 auto;
    /* фон контейнера заполняет «лишнее» место, canvas не растягивается */
  }
  body.expand-field canvas {
    width: 100%;
    height: 100%;
    object-fit: contain; /* сохраняет 4:3, без сплющивания хомяка */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* Поле скрыто, пока не начата игра */
  body.menu-mode canvas {
    visibility: hidden;
  }
  body.menu-mode #gameContainer {
    background: #07070f;
  }
  body.menu-mode .power-bar,
  body.menu-mode .mode-indicator,
  body.menu-mode .top-btns,
  body.menu-mode #achPopup {
    visibility: hidden;
    pointer-events: none;
  }
  body.menu-mode #statusBar {
    opacity: 0.35;
    pointer-events: none;
  }
  
  #overlay {
    position: absolute;
    inset: 0;
    background: #07070f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    z-index: 30;
    padding: 16px 14px 20px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border: none;
    border-radius: 0;
    box-shadow: none;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif;
  }
  #overlay h2 {
    font-family: 'Press Start 2P', system-ui, monospace;
    font-size: 14px;
    margin: 8px 0 14px;
    color: #ffb347;
    line-height: 1.45;
    text-shadow: 0 0 8px rgba(255,140,0,0.4);
    flex-shrink: 0;
  }
  #overlay p {
    font-size: 14px;
    line-height: 1.5;
    max-width: 100%;
    width: 100%;
    margin-bottom: 12px;
    color: #ddd;
  }
  #overlay .faq-body {
    text-align: left;
    width: 100%;
    max-width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.65;
    color: #ccc;
    padding: 0 8px 12px;
    box-sizing: border-box;
  }
  #overlay .faq-body h3 {
    font-family: 'Press Start 2P', system-ui, monospace;
    color: #ffb347;
    font-size: 11px;
    margin: 14px 0 8px;
    line-height: 1.4;
  }
  #overlay .faq-body b { color: #7fff7f; }
  .faq-dedicate {
    margin-top: 22px;
    padding: 14px 4px 6px;
    text-align: center;
  }
  .faq-dedicate-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, #e53935, transparent);
    margin: 0 auto 10px;
    max-width: 280px;
  }
  .faq-dedicate-line:last-child { margin: 10px auto 0; }
  .faq-dedicate p {
    font-family: 'Caveat', 'Segoe Script', cursive !important;
    font-size: 16px !important;
    font-weight: 700;
    color: #e53935 !important;
    margin: 0 !important;
    line-height: 1.2 !important;
    text-shadow: 0 0 10px rgba(229,57,53,0.35);
    white-space: nowrap !important;
    overflow: visible;
  }
  

  /* Главное меню и экраны меню занимают весь viewport, а не внутреннее 4:3-поле.
     Это убирает «кривой» первый кадр на телефонах и при возврате из игры. */
  body.menu-mode {
    padding: 0;
    justify-content: flex-start;
  }
  body.menu-mode > header,
  body.menu-mode > #statusBar,
  body.menu-mode > #mobileControls {
    visibility: hidden;
    pointer-events: none;
    display: none;
  }
  body.menu-mode #gameWrapper {
    position: static;
    width: 0;
    height: 0;
    min-height: 0;
    max-width: none;
    flex: 0 0 0;
    overflow: visible;
  }
  body.menu-mode #gameContainer {
    position: static;
    width: 0;
    height: 0;
    min-height: 0;
    border: 0;
    box-shadow: none;
    overflow: visible;
    background: transparent;
  }
  body.menu-mode #overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    min-height: 100%;
    border: 0;
    border-radius: 0;
    z-index: 9999;
    padding: max(18px, env(safe-area-inset-top, 18px)) 16px max(18px, env(safe-area-inset-bottom, 18px));
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  body.menu-mode #overlay .menu-hero {
    width: min(440px, 100%);
    margin: auto;
  }
  body.menu-mode #overlay .menu-tools {

  if(!soundOn||!audioCtx) return;

    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();

  }catch(e){}
}

function getEnemySpeed(type){
  // До 15 — обычный рост, 15–20 — жёстче, после 20 — мягкий потолок
  let scaledLevel;
  if(level <= 15) scaledLevel = level;
  else if(level <= 20) scaledLevel = 15 + (level-15)*1.4;
  else scaledLevel = 22 + Math.sqrt(level-20)*2.2;
  const base = 0.05 + Math.min(scaledLevel, 36)*0.0075;
  const slowMult = 1 - upgrades.enemySlow*0.12;
  if(type==='fast') return base * 1.45 * slowMult;
  if(type==='tank') return base * 0.65 * slowMult;
  if(type==='miner') return base * 0.9 * slowMult;
  return base * slowMult;
}
function spawnEnemies(count){

    enemies.push({x:ex,y:ey,vx:(Math.random()<0.5?-1:1)*speed,vy:(Math.random()<0.5?-1:1)*speed,type,hp:type==='tank'?2:1});

  }
}

function calcPercent(){
  let claimed=0, total=(COLS-2)*(ROWS-2);
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++) if(field[y][x]===CLAIMED) claimed++;
  percent=Math.floor(claimed/total*100); return percent;
}
function addScore(area){
  const pts=Math.floor(area*4*combo);
  // анти-фарм: меньше за очень большие куски
  const capped = Math.min(pts, 120 + level * 15);
  score+=capped; stats.totalCells+=area;
  const prevCombo = combo;
  combo=Math.min(combo+0.3,5); if(combo>stats.bestCombo) stats.bestCombo=combo;
  if(Math.floor(combo) > Math.floor(prevCombo) && combo >= 2) comboBanner = 45;
  comboTimer=160; lastClaim=area;
  // всплывающий текст + ripple
  floatTexts.push({
    x: player.x*CELL+CELL/2,
    y: player.y*CELL,
    text: '+'+capped + (combo>=2 ? ' x'+combo.toFixed(1) : ''),
    life: 50, max: 50,
    color: combo>=3 ? '#ff6b6b' : '#ffd700'
  });
  claimRipples.push({x: player.x*CELL+CELL/2, y: player.y*CELL+CELL/2, r: 4, maxR: 40+Math.min(area,80), life: 30});
  checkAchievements();
  saveStats(); saveCoins(); updateUI(); return capped;
}

function clearAllTrails(){
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(field[y][x]===TRAIL || field[y][x]===SAFE_TRAIL) field[y][x]=EMPTY;
  }
}

function closeTrail(who='player'){
  const tr = who==='player'?trail : (who==='bot'?bot.trail : (mirrorPlayer?mirrorPlayer.trail:[]));
  if(!tr || tr.length<2){
    if(tr) for(const p of tr) if(field[p.y]?.[p.x]===TRAIL||field[p.y]?.[p.x]===SAFE_TRAIL) field[p.y][p.x]=EMPTY;
    if(who==='player'){ trail=[]; player.drawing=false; }
    else if(who==='bot'&&bot){ bot.trail=[]; bot.drawing=false; }
    else if(mirrorPlayer){ mirrorPlayer.trail=[]; mirrorPlayer.drawing=false; }
    clearAllTrails();
    return;
  }
  for(const p of tr) field[p.y][p.x]=CLAIMED;

  const reachable=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const q=[];
  for(const e of enemies){
    const cx=Math.floor(e.x),cy=Math.floor(e.y);
    if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS&&field[cy][cx]===EMPTY){ q.push([cx,cy]); reachable[cy][cx]=true; }
  }
  // Босс НЕ сидирует зону — его можно «отрезать» захватом территории
  while(q.length){
    const [x,y]=q.shift();
    for(let d=0;d<4;d++){
      const nx=x+DX[d],ny=y+DY[d];
      if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!reachable[ny][nx]&&field[ny][nx]===EMPTY){ reachable[ny][nx]=true; q.push([nx,ny]); }
    }
  }
  let claimedCells=0; const list=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(field[y][x]===EMPTY && !reachable[y][x]){ field[y][x]=CLAIMED; claimedCells++; list.push([x,y]); }
  }
  if(list.length){
    const cx=list.reduce((s,p)=>s+p[0],0)/list.length;
    const cy=list.reduce((s,p)=>s+p[1],0)/list.length;
    list.sort((a,b)=>((a[0]-cx)**2+(a[1]-cy)**2)-((b[0]-cx)**2+(b[1]-cy)**2));
    list.forEach((p,i)=>fillQueue.push({x:p[0],y:p[1],delay:Math.floor(i/10)}));
  }
  if(claimedCells>0 && who==='player'){
    const big=claimedCells>35; sfxClaim(big); vibrate(big?50:20); addScore(claimedCells);
    for(let i=0;i<Math.min(5,Math.floor(claimedCells/12));i++){
      const [cx,cy]=list[Math.floor(Math.random()*list.length)];
      spawnParticles(cx,cy, theme.particle[Math.random()<0.5?0:1], big?12:7);
    }
    const chance = 0.28 + upgrades.powerChance*0.1;
    if(claimedCells>18 && Math.random()<chance){
      const [px,py]=list[Math.floor(Math.random()*list.length)];
      spawnPowerupNear(px,py);
    }
    // Урон боссу: отрезали зону под ним или рядом
    if(boss){
      const bx = Math.floor(boss.x), by = Math.floor(boss.y);
      let hit = false;
      let crushed = field[by] && field[by][bx] === CLAIMED;
      if(crushed) hit = true;
      if(!hit && claimedCells >= 20){
        for(const [lx,ly] of list){
          if(Math.abs(lx-bx)+Math.abs(ly-by) <= 4){ hit = true; break; }
        }
      }
      if(hit){
        const dmg = crushed
          ? Math.min(boss.hp, 3 + Math.floor(claimedCells / 25))
          : Math.min(boss.hp, 1 + Math.floor(claimedCells / 50));
        boss.hp -= dmg;
        floatTexts.push({
          x: boss.x*CELL+CELL/2, y: boss.y*CELL - 10,
          text: '💥 -'+dmg, life: 55, max: 55, color: '#ff5252'
        });
        shake = 10;
        sfxMine();
        // вытолкнуть босса на пустую клетку
        if(crushed && boss.hp > 0){
          let placed = false;
          for(let r=1;r<12 && !placed;r++){
            for(let dy=-r;dy<=r && !placed;dy++) for(let dx=-r;dx<=r && !placed;dx++){
              const nx=bx+dx, ny=by+dy;
              if(nx>1&&nx<COLS-2&&ny>1&&ny<ROWS-2&&field[ny][nx]===EMPTY){
                boss.x=nx; boss.y=ny; placed=true;
              }
            }
          }
        }
        if(boss.hp <= 0){
          stats.bossKills++; saveStats();
          score += 200 + level * 25;
          floatTexts.push({x: bx*CELL+CELL/2, y: by*CELL, text: '👾 BOSS DOWN!', life: 70, max: 70, color: '#ffd700'});
          spawnParticles(bx, by, '#ff5252', 20);
          boss = null;
          updateUI();
        }
      }
    }
  } else if(claimedCells>0 && who==='bot'){
    botScore += Math.floor(claimedCells*9);
  }
  if(who==='player'){ trail=[]; player.drawing=false; }
  else if(who==='bot'&&bot){ bot.trail=[]; bot.drawing=false; }
  else if(mirrorPlayer){ mirrorPlayer.trail=[]; mirrorPlayer.drawing=false; }
  clearAllTrails();
  percent=calcPercent(); updateUI();
  checkWin();
}
function spawnPowerupNear(x,y){
  const types=['freeze','speed','shield','bomb','magnet'];
  const type=types[Math.floor(Math.random()*types.length)];
  for(let r=1;r<12;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(nx>1&&nx<COLS-2&&ny>1&&ny<ROWS-2&&field[ny][nx]===EMPTY){
      powerups.push({x:nx,y:ny,type,life:500}); return;
    }
  }
}

function die(who='player'){
  if(who==='player'){
    if(active.shield>0){
      active.shield = Math.max(0, active.shield - 50);
      updatePowerUI(); sfxPower(); vibrate(40);
      for(let i=0;i<12;i++) spawnParticles(player.x,player.y,'#fff',1);
      clearAllTrails(); trail=[]; player.drawing=false;
      return;
    }
    sfxDeath(); vibrate([80, 50, 100]); shake=14; lives--; stats.deaths++;
    clearAllTrails(); trail=[]; player.drawing=false;
    player.x=40; player.y=0; player.dir=1;
    combo=1; comboTimer=0; updateUI(); saveStats();
    if(lives<=0){
      gameState='gameover';
      showOverlay('💀 ИГРА ОКОНЧЕНА',`💎 Монеты: ${score}`,'🏠 В МЕНЮ',showMainMenu);
    } else {
      gameState='dead';
      showOverlay('💥 АЙ!',`❤️ Жизней: ${lives}`,'▶️ ДАЛЬШЕ',()=>{ gameState='play'; setMenuMode(false); document.getElementById('overlay').classList.add('hidden'); });
    }
  } else if(who==='bot' && bot){
    clearAllTrails(); bot.trail=[]; bot.drawing=false; bot.x=20; bot.y=0;
  }
}

function toggleFullScreen(){
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(()=>{});
    } else if (document.documentElement.webkitRequestFullscreen) {
      document.documentElement.webkitRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
}

function requestGameFullscreen(){
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  } catch(e){}
}

function applyControlLayout(){
  const mc = document.getElementById('mobileControls');
  if(!mc) return;
  const dpad = mc.querySelector('.dpad');


  // scale
  const s = ctrlScale;
  mc.style.setProperty('--dpad-size', (110 * s) + 'px');
  mc.style.setProperty('--dpad-btn', (38 * s) + 'px');
  mc.style.setProperty('--dpad-fs', (15 * s) + 'px');
  mc.style.setProperty('--ctrl-fs', Math.max(10, 11 * s) + 'px');
  mc.style.setProperty('--ctrl-area-h', (120 * s) + 'px');

  // custom positions or default flex
  if(ctrlPos && dpad){
    mc.style.display = 'block';
    mc.style.flexDirection = 'row';
    mc.style.minHeight = (130 * s) + 'px';
    dpad.style.position = 'absolute';
    dpad.style.left = ctrlPos.dpad.x + 'px';
    dpad.style.top = ctrlPos.dpad.y + 'px';
    dpad.style.right = 'auto';
    dpad.style.bottom = 'auto';
  } else {
    mc.style.display = 'flex';
    mc.style.flexDirection = 'row';
    if(dpad){
      dpad.style.position = 'relative';
      dpad.style.left = dpad.style.top = dpad.style.right = dpad.style.bottom = '';
    }
  }

  // restore original dirs (no invert)
  document.querySelectorAll('.dpad-btn').forEach(btn=>{
    if(btn.dataset.origDir !== undefined) btn.dataset.dir = btn.dataset.origDir;
  });

  mc.classList.toggle('edit-mode', editControls);
  setupControlDrag();
}

function setupControlDrag(){
  const mc = document.getElementById('mobileControls');
  const dpad = mc && mc.querySelector('.dpad');
  if(!mc || !dpad) return;

  const makeDraggable = (el, key) => {
    let dragging = false, ox = 0, oy = 0;
    const onStart = (e) => {
      if(!editControls) return;
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      const t = e.touches ? e.touches[0] : e;
      const rect = el.getBoundingClientRect();
      const mcRect = mc.getBoundingClientRect();
      ox = t.clientX - rect.left;
      oy = t.clientY - rect.top;
      // ensure absolute
      if(!ctrlPos){
        ctrlPos = {
          dpad: { x: dpad.offsetLeft, y: dpad.offsetTop },
        };
      }
      el.style.position = 'absolute';
      mc.style.display = 'block';
    };
    const onMove = (e) => {
      if(!dragging || !editControls) return;
      e.preventDefault();
      const t = e.touches ? e.touches[0] : e;
      const mcRect = mc.getBoundingClientRect();
      let x = t.clientX - mcRect.left - ox;
      let y = t.clientY - mcRect.top - oy;
      x = Math.max(0, Math.min(mcRect.width - el.offsetWidth, x));
      y = Math.max(0, Math.min(mcRect.height - el.offsetHeight, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      if(!ctrlPos) ctrlPos = { dpad:{x:0,y:0} };
      ctrlPos[key] = { x, y };
    };
    const onEnd = () => {
      if(!dragging) return;
      dragging = false;
      if(ctrlPos) localStorage.setItem('hamster_ctrl_pos', JSON.stringify(ctrlPos));
    };
    el.onpointerdown = onStart;
    el.ontouchstart = onStart;
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('pointerup', onEnd);
    window.addEventListener('touchend', onEnd);
  };
  makeDraggable(dpad, 'dpad');
}

function showUpgradeTree(){
  gameState='shop';
  setMenuMode(true);
  const ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
  const branches = [
    { id:'life', title:'❤️ Жизнь' },
    { id:'luck', title:'🍀 Удача' },
    { id:'combat', title:'⚔️ Бой' }
  ];
  let html = `<h2>🌳 ДЕРЕВО АПГРЕЙДОВ</h2>
    <p style="font-size:14px;margin-bottom:8px">💎 Монеты: <b style="color:#ffd700">${score}</b></p>
    <div class="tree-wrap">`;
  branches.forEach(br=>{
    html += `<div class="tree-branch"><div class="tree-branch-title">${br.title}</div>`;
    UPGRADE_TREE.filter(u=>u.branch===br.id).forEach(u=>{
      const lvl = upgrades[u.id]||0;
      const maxed = lvl >= u.max;
      const locked = u.requires && !(upgrades[u.requires] > 0);
      const cost = upgradeCost(u, lvl);
      const can = !maxed && !locked && score >= cost;
      let status = maxed ? '✓ МАКС' : locked ? '🔒 Сначала предыдущий' : (can ? '💎 '+cost : '🔒 '+cost);
      html += `<div class="tree-node ${maxed?'owned':''} ${locked?'locked':''} ${can?'can':''}" data-id="${u.id}">
        <b>${u.name}</b> <span class="tree-lvl">${lvl}/${u.max}</span>
        <div class="tree-desc">${u.desc}</div>
        <div class="price">${status}</div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>
    <div class="mode-btns" style="margin-top:12px">
      <button class="btn" id="nextLvl">🚀 СЛЕД. УРОВЕНЬ</button>
      <button class="btn secondary" id="treeMenu">🏠 МЕНЮ</button>
    </div>`;
  ov.innerHTML = html;

  ov.querySelectorAll('.tree-node').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      const def = UPGRADE_TREE.find(d=>d.id===id);
      if(!def) return;
      const lvl = upgrades[id]||0;
      if(lvl >= def.max) return;
      if(def.requires && !(upgrades[def.requires] > 0)){
        showAchPopup('Сначала открой предыдущий');
        return;
      }
      const cost = upgradeCost(def, lvl);
      if(score < cost){
        showAchPopup('Мало монет');
        return;
      }
      score -= cost;
      upgrades[id] = lvl + 1;
      localStorage.setItem('hamster_upgrades', JSON.stringify(upgrades));
      if(id === 'lives') lives = Math.min(lives + 1, maxLives());
      if(id === 'startShield' && typeof active !== 'undefined') active.shield = Math.max(active.shield||0, 240);
      updateUI(); updatePowerUI(); sfxPower();
      showUpgradeTree();
    };
  });
  const nextBtn = document.getElementById('nextLvl');
  if(nextBtn) nextBtn.onclick = ()=>{
    level++;
    stats.levelsCleared++;
    saveStats();
    if(lives > maxLives()) lives = maxLives();
    if(lives < 1) lives = 1;
    resetLevel();
    gameState = 'play';
    setMenuMode(false);
    document.getElementById('overlay').classList.add('hidden');
  };
  const treeMenu = document.getElementById('treeMenu');
  if(treeMenu) treeMenu.onclick = showMainMenu;
}

      <div class="price">${selectedSkin===s.id?'ВЫБРАН':(unlocked?'ВЫБРАТЬ':'ЗАКРЫТ')}</div>
    </div>`;
  });

}

function checkWin(){
  if(percent<80) return;
  sfxLevel(); vibrate(100); score+=Math.min(level*80, 500); updateUI();
  shake=18;
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2;
    particles.push({x:W/2,y:H/2,vx:Math.cos(a)*(2+Math.random()*4),vy:Math.sin(a)*(2+Math.random()*4),life:40+Math.random()*20,max:60,color:theme.particle[i%2],size:2+Math.random()*3});
  }
  stats.levelsCleared++; saveStats();
  checkAchievements();
  SKINS.forEach(s=>{ if(score>=s.unlock && !unlockedSkins.includes(s.id)){ unlockedSkins.push(s.id); localStorage.setItem('hamster_skins',JSON.stringify(unlockedSkins)); } });
  gameState='win';
  let extra='';
  if(mode==='duel') extra = `<br>Очки бота за уровень: <b>${botScore}</b>`;
  showOverlay(`🎉 Ур. ${level} пройден!`,`💎 +${level*80} · 📦 ${percent}%${extra}`,'🌳 ДЕРЕВО АПГРЕЙДОВ',showUpgradeTree);
}

function moveEnemies(){
  if(active.freeze>0) return;
  const speedMult = (mode==='chaos' && chaosWave) ? 1.7 : 1;
  for(const e of enemies){
    let nx=e.x+e.vx*speedMult, ny=e.y+e.vy*speedMult;
    const solid=(x,y)=>{
      const cx=Math.floor(x),cy=Math.floor(y);
      if(cx<1||cx>=COLS-1||cy<1||cy>=ROWS-1) return true;
      const v=field[cy]?.[cx]; return v===CLAIMED||v===BORDER||v===SAFE_TRAIL||v===TEMP_WALL;
    };
    if(solid(nx,e.y)){ e.vx*=-1; nx=e.x+e.vx*speedMult; }
    if(solid(e.x,ny)){ e.vy*=-1; ny=e.y+e.vy*speedMult; }
    if(solid(nx,ny)){ e.vx*=-1; e.vy*=-1; nx=e.x+e.vx*speedMult; ny=e.y+e.vy*speedMult; }
    e.x=nx; e.y=ny;
    const tcx=Math.floor(e.x),tcy=Math.floor(e.y);
    if(tcx>=0&&tcx<COLS&&tcy>=0&&tcy<ROWS && field[tcy][tcx]===TRAIL){ die('player'); return; }
    if(e.type==='miner' && Math.random()<0.0035){
      const mx=Math.floor(e.x),my=Math.floor(e.y);
      if(mx>1&&mx<COLS-2&&my>1&&my<ROWS-2&&field[my][mx]===EMPTY) mines.push({x:mx,y:my,timer:160+Math.random()*50|0});
    }
  }
  if(boss){
    let nx=boss.x+boss.vx*speedMult, ny=boss.y+boss.vy*speedMult;
    const solid=(x,y)=>{ const cx=Math.floor(x),cy=Math.floor(y); if(cx<2||cx>=COLS-2||cy<2||cy>=ROWS-2) return true; const v=field[cy]?.[cx]; return v===CLAIMED||v===BORDER||v===TEMP_WALL; };
    if(solid(nx,boss.y)) boss.vx*=-1;
    if(solid(boss.x,ny)) boss.vy*=-1;
    boss.x+=boss.vx*speedMult; boss.y+=boss.vy*speedMult;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const cx=Math.floor(boss.x)+dx, cy=Math.floor(boss.y)+dy;
      if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS && field[cy][cx]===TRAIL){ die('player'); return; }
    }
  }
  for(let i=mines.length-1;i>=0;i--){
    const m=mines[i]; m.timer--;
    if(m.timer<=0){
      sfxMine(); vibrate(40); shake=8;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
        const nx=m.x+dx,ny=m.y+dy;
        if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&field[ny][nx]===CLAIMED){ field[ny][nx]=EMPTY; spawnParticles(nx,ny,'#ff5722',3); }
      }
      mines.splice(i,1); percent=calcPercent(); updateUI();
    }
  }
  for(let i=tempWalls.length-1;i>=0;i--){
    tempWalls[i].life--;
    if(tempWalls[i].life<=0){
      const {x,y}=tempWalls[i];
      if(field[y][x]===TEMP_WALL) field[y][x]=EMPTY;
      tempWalls.splice(i,1);
    }
  }
}

function tryMove(dir, who='player'){
  let p, tr;
  if(who==='player'){ p=player; tr=trail; }
  else if(who==='bot'){ p=bot; tr=bot.trail; }
  else { p=mirrorPlayer; tr=mirrorPlayer.trail; }
  if(!p) return;

  const nx=p.x+DX[dir], ny=p.y+DY[dir];
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return;
  const cell=field[ny][nx];
  if(cell===TRAIL||cell===SAFE_TRAIL||cell===TEMP_WALL) return;
  const isSafe = false;

  if(cell===CLAIMED||cell===BORDER){
    if(p.drawing && tr.length>0) closeTrail(who);
    p.x=nx; p.y=ny; p.drawing=false;
  } else {
    if(!p.drawing){ p.drawing=true; if(who==='player') trail=[]; else if(who==='bot') bot.trail=[]; else mirrorPlayer.trail=[]; }
    if(field[p.y][p.x]===EMPTY){
      field[p.y][p.x]=TRAIL;
      tr.push({x:p.x,y:p.y});
      if(who==='player') spawnSpark(p.x,p.y);
    }
    p.x=nx; p.y=ny;
    if(field[ny][nx]===EMPTY){
      field[ny][nx]=TRAIL;
      tr.push({x:nx,y:ny});
      if(who==='player'){ spawnSpark(nx,ny); if(Math.random()<0.4) spawnSpark(nx,ny); }
    }
  }
  p.dir=dir; p.moving=true;

  if(who==='player'){
    for(let i=powerups.length-1;i>=0;i--){
      if(powerups[i].x===player.x && powerups[i].y===player.y){
        collectPower(powerups[i].type); powerups.splice(i,1);
      }
    }
    for(let i=goldCoins.length-1;i>=0;i--){
      if(goldCoins[i].x===player.x && goldCoins[i].y===player.y){
        const bonus=Math.floor(25*combo);
        score+=bonus;
        spawnParticles(player.x,player.y,'#ffd700',14);
        sfxPower(); vibrate(20);
        showAchPopup('💰 +'+bonus);
        goldCoins.splice(i,1); goldCoinCooldown=450+Math.random()*400;
        updateUI();
      }
    }
    for(let i=food.length-1;i>=0;i--){
      if(food[i].x===player.x && food[i].y===player.y){
        const gain=food[i].gain;
        hunger=Math.min(100,hunger+gain);
        spawnParticles(player.x,player.y,'#8bc34a',16);
        sfxPower(); vibrate(20);
        showAchPopup('🥕 +'+gain+'% сытости');
        food.splice(i,1); foodCooldown=420+Math.random()*300;
        updateUI();
      }
    }
  }
}

function collectPower(type){
  sfxPower(); vibrate(30); spawnParticles(player.x,player.y,'#fff',12);
  if(type==='freeze') active.freeze=320;
  else if(type==='speed') active.speed=400;
  else if(type==='shield') active.shield=420;
  else if(type==='magnet') active.magnet=320 + (upgrades.magnetBonus||0)*100;
  else if(type==='bomb'){
    let got=0;
    const br = 3 + (upgrades.bombPower||0);
    for(let dy=-br;dy<=br;dy++) for(let dx=-br;dx<=br;dx++){
      const nx=player.x+dx,ny=player.y+dy;
      if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&field[ny][nx]===EMPTY){
        field[ny][nx]=CLAIMED; got++; spawnParticles(nx,ny,'#ff9800',2);
      }
      if(boss && Math.abs(Math.floor(boss.x)-player.x)<=br && Math.abs(Math.floor(boss.y)-player.y)<=br){
        const bd = 4 + (upgrades.bombPower||0)*2;
        boss.hp-=bd;
        floatTexts.push({x:boss.x*CELL+CELL/2, y:boss.y*CELL-12, text:'💥 -'+bd, life:50, max:50, color:'#ff5252'});
        shake=12;
        if(boss.hp<=0){
          stats.bossKills++; saveStats();
          score+=200+level*25;
          floatTexts.push({x:boss.x*CELL+CELL/2, y:boss.y*CELL, text:'👾 BOSS DOWN!', life:70, max:70, color:'#ffd700'});
          spawnParticles(Math.floor(boss.x), Math.floor(boss.y), '#ff5252', 24);
          boss=null;
          if(!achievements.bossbomb){
            achievements.bossbomb=true;
            localStorage.setItem('hamster_ach',JSON.stringify(achievements));
            score+=500; showAchPopup('Босс на бомбе +500'); sfxAch();
          }
          updateUI();
        }
      }
    }
    if(got){ addScore(got); percent=calcPercent(); updateUI(); sfxClaim(true); }
  }
  updatePowerUI();
}

function updateBot(){
  if(!bot||!bot.alive) return;
  bot.timer--;
  if(bot.timer>0) return;
  bot.timer = 6 + Math.floor(Math.random()*8);

  let dir = bot.dir;
  const px=player.x, py=player.y;

  if(Math.random()<0.4){
    if(Math.abs(px-bot.x)>Math.abs(py-bot.y)) dir = px>bot.x?0:2;
    else dir = py>bot.y?1:3;
  } else if(Math.random()<0.35){
    const candidates=[];
    for(let d=0;d<4;d++){
      const nx=bot.x+DX[d],ny=bot.y+DY[d];
      if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1 && field[ny][nx]===EMPTY) candidates.push(d);
    }
    if(candidates.length) dir=candidates[Math.floor(Math.random()*candidates.length)];
  } else {
    if(Math.random()<0.6) dir=bot.dir;
    else dir=Math.floor(Math.random()*4);
  }
  if(bot.drawing && bot.trail.length>8 && Math.random()<0.25){
    for(let d=0;d<4;d++){
      const nx=bot.x+DX[d],ny=bot.y+DY[d];
      if(field[ny]?.[nx]===CLAIMED||field[ny]?.[nx]===BORDER){ dir=d; break; }
    }
  }
  tryMove(dir,'bot');
}

function updateMagnet(){
  if(active.magnet<=0) return;
  for(const p of powerups){
    const dx=player.x - p.x, dy=player.y - p.y;
    const dist=Math.abs(dx)+Math.abs(dy);
    if(dist>0 && dist<18){
      if(Math.abs(dx)>Math.abs(dy)) p.x += Math.sign(dx);
      else p.y += Math.sign(dy);
      p.x=Math.max(1,Math.min(COLS-2,p.x));
      p.y=Math.max(1,Math.min(ROWS-2,p.y));
    }
  }
}

function updateChaos(){
  if(mode!=='chaos') return;
  chaosTimer--;
  if(chaosTimer<=0){
    chaosWave = !chaosWave;
    chaosTimer = chaosWave ? 180 : 350;
    if(chaosWave){
      shake=10;
      for(let i=0;i<6;i++){
        const x=5+Math.floor(Math.random()*(COLS-10));
        const y=5+Math.floor(Math.random()*(ROWS-10));
        if(field[y][x]===EMPTY){
          field[y][x]=TEMP_WALL;
          tempWalls.push({x,y,life:200});
        }
      }
    }
  }
}

function draw(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.88; if(shake<0.4) shake=0; }

  // Фон
  ctx.fillStyle=theme.bg; ctx.fillRect(0,0,W,H);

  // Звёзды / частицы фона
  const tnow = performance.now();
  for(const s of bgStars){
    s.tw += 0.03;
    const alpha = s.a * (0.55 + 0.45*Math.sin(s.tw));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = theme.spark || '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
    ctx.fill();
    // медленный дрейф
    s.y += s.sp * 0.15;
    if(s.y > H){ s.y = 0; s.x = Math.random()*W; }
  }
  ctx.globalAlpha = 1;

  // Клетки поля
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const v=field[y][x];
    if(v===CLAIMED){
      ctx.fillStyle=theme.claimed(level);
      ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
      // лёгкий «пиксельный» блик
      ctx.fillStyle='rgba(255,255,255,0.04)';
      ctx.fillRect(x*CELL,y*CELL,CELL,2);
    } else if(v===BORDER){
      // объёмная рамка
      const g = ctx.createLinearGradient(x*CELL,y*CELL,x*CELL+CELL,y*CELL+CELL);
      g.addColorStop(0, theme.border);
      g.addColorStop(1, '#0a0a12');
      ctx.fillStyle=g;
      ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
      ctx.fillStyle='rgba(255,255,255,0.08)';
      ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,1);
    } else if(v===TRAIL){
      ctx.fillStyle=theme.trail;
      ctx.shadowColor=theme.trail;
      ctx.shadowBlur=6;
      ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
      ctx.shadowBlur=0;
    } else if(v===SAFE_TRAIL){
      ctx.fillStyle=theme.safe;
      ctx.shadowColor=theme.safe;
      ctx.shadowBlur=5;
      ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
      ctx.shadowBlur=0;
    } else if(v===TEMP_WALL){
      ctx.fillStyle='#ff6f00';
      ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
      ctx.fillStyle='rgba(255,200,0,0.35)';
      ctx.fillRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4);
    }
  }

  // Мины
  for(const m of mines){
    const pulse=0.55+Math.sin(tnow/110)*0.4;
    ctx.globalAlpha=pulse;
    ctx.fillStyle='#ff5722';
    ctx.beginPath(); ctx.arc(m.x*CELL+CELL/2,m.y*CELL+CELL/2,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffeb3b';
    ctx.beginPath(); ctx.arc(m.x*CELL+CELL/2,m.y*CELL+CELL/2,2.2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // Пауэр-апы на игровом поле — максимально заметные и яркие
  for(const p of powerups){
    const px=p.x*CELL+CELL/2, py=p.y*CELL+CELL/2;
    const bob = Math.sin(tnow/160 + p.x)*2;
    const pulse = 1 + Math.sin(tnow/100 + p.y)*0.08;
    const icon={freeze:'❄️',speed:'⚡',shield:'🛡️',bomb:'💥',magnet:'🧲'}[p.type]||'?';
    const glow={freeze:'#4fc3f7',speed:'#fff176',shield:'#69f0ae',bomb:'#ff7043',magnet:'#ce93d8'}[p.type]||'#fff';
    ctx.globalAlpha=1;
    ctx.shadowColor=glow;
    ctx.shadowBlur=14;
    ctx.font=`${20*pulse}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(icon,px,py+bob);
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
  }

  // Золотые монеты
  for(const g of goldCoins){
    const gx=g.x*CELL+CELL/2, gy=g.y*CELL+CELL/2;
    const bob = Math.sin(tnow/120)*2.5;
    ctx.globalAlpha=0.75+Math.sin(tnow/100)*0.25;
    ctx.shadowColor='#ffd700';
    ctx.shadowBlur=10;
    ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💰',gx,gy+bob);
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
  }

  // Еда для хомяка
  for(const f of food){
    const fx=f.x*CELL+CELL/2, fy=f.y*CELL+CELL/2;
    const bob=Math.sin(tnow/150+f.x)*2;
    const pulse=1+Math.sin(tnow/110+f.x)*0.08;
    ctx.globalAlpha=1;
    ctx.shadowColor='#fff'; ctx.shadowBlur=4;
    ctx.font=`${18*pulse}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.type,fx,fy+bob);
    ctx.shadowColor='#8cff66'; ctx.shadowBlur=9;
    ctx.fillText(f.type,fx,fy+bob);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Враги
  for(const e of enemies){
    const wiggle = active.freeze>0 ? 0 : Math.sin(tnow/120 + e.x*3)*1.2;
    const ex=e.x*CELL+CELL/2 + wiggle, ey=e.y*CELL+CELL/2;
    const r=e.type==='tank'?CELL*0.48:e.type==='fast'?CELL*0.32:CELL*0.4;
    let col=theme.enemy[e.type==='fast'?1:e.type==='tank'?2:0];
    if(active.freeze>0) col='#90caf9';
    // тень
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(ex+1,ey+2,r*0.9,r*0.5,0,0,Math.PI*2); ctx.fill();
    // тело
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(ex,ey,r,0,Math.PI*2); ctx.fill();
    // блик
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(ex-r*0.25,ey-r*0.3,r*0.28,0,Math.PI*2); ctx.fill();
    // глаза
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(ex-r*0.28,ey-r*0.1,r*0.2,0,Math.PI*2); ctx.arc(ex+r*0.28,ey-r*0.1,r*0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(ex-r*0.28,ey-r*0.08,r*0.1,0,Math.PI*2); ctx.arc(ex+r*0.28,ey-r*0.08,r*0.1,0,Math.PI*2); ctx.fill();
    // тип-маркер
    if(e.type==='tank'){
      ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(ex,ey,r*0.7,0,Math.PI*2); ctx.stroke();
    } else if(e.type==='fast'){
      ctx.fillStyle='rgba(255,255,100,0.5)';
      ctx.fillRect(ex-r-4,ey-1,3,2);
    } else if(e.type==='miner'){
      ctx.fillStyle='#ff9800';
      ctx.beginPath(); ctx.arc(ex,ey+r*0.55,2,0,Math.PI*2); ctx.fill();
    }
  }

  // Босс
  if(boss){
    const ex=boss.x*CELL+CELL/2, ey=boss.y*CELL+CELL/2, r=CELL*boss.r;
    const pulse = 1 + Math.sin(tnow/200)*0.04;
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(ex+2,ey+3,r*0.95*pulse,r*0.55,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=active.freeze>0?'#90caf9':'#d50000';
    ctx.beginPath(); ctx.arc(ex,ey,r*pulse,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ff8a80'; ctx.lineWidth=2.5; ctx.stroke();
    // глаза босса
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(ex-r*0.35,ey-r*0.15,r*0.22,0,Math.PI*2); ctx.arc(ex+r*0.35,ey-r*0.15,r*0.22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(ex-r*0.35,ey-r*0.1,r*0.1,0,Math.PI*2); ctx.arc(ex+r*0.35,ey-r*0.1,r*0.1,0,Math.PI*2); ctx.fill();
    // HP bar
    ctx.fillStyle='#222'; ctx.fillRect(ex-20,ey-r-12,40,5);
    ctx.fillStyle='#f44336'; ctx.fillRect(ex-20,ey-r-12,40*(boss.hp/boss.maxHp),5);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(ex-20,ey-r-12,40,5);
  }

  if(bot) drawChar(bot.x,bot.y,bot.dir,'#90caf9','#5c9ead',false);
  if(mirrorPlayer) drawChar(mirrorPlayer.x,mirrorPlayer.y,mirrorPlayer.dir,'#ce93d8','#ab47bc',false);

  const skin = SKINS.find(s=>s.id===selectedSkin)||SKINS[0];
  drawChar(player.x,player.y,player.dir,skin.body,skin.ear,true,skin.hat);

  // Искры
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.life--; if(s.life<=0){sparks.splice(i,1);continue;}
    ctx.globalAlpha=s.life/s.max; ctx.fillStyle=theme.spark;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size*(s.life/s.max),0,Math.PI*2); ctx.fill();
  }
  // Частицы
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life--;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(p.life/p.max),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Волны захвата
  for(let i=claimRipples.length-1;i>=0;i--){
    const r=claimRipples[i];
    r.r += (r.maxR - r.r) * 0.15;
    r.life--;
    if(r.life<=0){ claimRipples.splice(i,1); continue; }
    ctx.globalAlpha = r.life/30 * 0.5;
    ctx.strokeStyle = theme.trail;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.stroke();
  }

  // Всплывающий счёт
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=floatTexts.length-1;i>=0;i--){
    const f=floatTexts[i];
    f.y -= 0.9;
    f.life--;
    if(f.life<=0){ floatTexts.splice(i,1); continue; }
    ctx.globalAlpha = f.life/f.max;
    ctx.font = 'bold 12px "Press Start 2P", monospace';
    ctx.fillStyle = f.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha=1;

  // Баннер комбо
  if(comboBanner > 0){
    comboBanner--;
    const a = Math.min(1, comboBanner/15) * Math.min(1, (45-comboBanner)/8);
    ctx.globalAlpha = a * 0.9;
    ctx.font = 'bold 18px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b6b';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    const txt = '🔥 x' + combo.toFixed(1);
    ctx.strokeText(txt, W/2, H*0.28);
    ctx.fillText(txt, W/2, H*0.28);
    ctx.globalAlpha = 1;
  }

  // Лёгкий виньет
  const vig = ctx.createRadialGradient(W/2,H/2,H*0.35, W/2,H/2,H*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=vig;
  ctx.fillRect(0,0,W,H);

  ctx.restore();
}

function drawChar(gx,gy,dir,body,ear,isPlayer=false,hasHat=false){
  const px=gx*CELL, py=gy*CELL, cx=px+CELL/2, cy=py+CELL/2;
  const tnow = performance.now();

  // эффекты игрока
  if(isPlayer && active.shield>0){
    ctx.strokeStyle=`rgba(100,200,255,${0.4+Math.sin(tnow/80)*0.3})`;
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx,cy,CELL*0.72,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${0.2+Math.sin(tnow/60)*0.15})`;
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,cy,CELL*0.85,0,Math.PI*2); ctx.stroke();
  }
  if(isPlayer && active.speed>0){
    ctx.fillStyle='rgba(255,230,0,0.35)';
    for(let i=1;i<=3;i++){
      ctx.beginPath();
      ctx.ellipse(cx-DX[dir]*i*4, cy-DY[dir]*i*4, 4.5-i*0.8, 2.8, 0,0,Math.PI*2);
      ctx.fill();
    }
  }
  if(isPlayer && active.magnet>0){
    ctx.strokeStyle=`rgba(255,80,80,${0.35+Math.sin(tnow/100)*0.2})`;
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,CELL*0.95,0,Math.PI*2); ctx.stroke();
  }
  if(isPlayer && active.freeze>0){
    // лёгкий холодный ореол
    ctx.fillStyle='rgba(150,220,255,0.12)';
    ctx.beginPath(); ctx.arc(cx,cy,CELL*0.8,0,Math.PI*2); ctx.fill();
  }

  // тень
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx+1, cy+CELL*0.42, CELL*0.38, CELL*0.14, 0,0,Math.PI*2); ctx.fill();

  // тело
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.ellipse(cx, cy+1, CELL*0.42, CELL*0.38, 0,0,Math.PI*2); ctx.fill();
  // блик на теле
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(cx-2, cy-2, CELL*0.18, CELL*0.14, -0.4, 0, Math.PI*2); ctx.fill();

  // уши
  ctx.fillStyle=ear;
  ctx.beginPath(); ctx.arc(cx-4.8, cy-5.8, 3.8, 0, Math.PI*2); ctx.arc(cx+4.8, cy-5.8, 3.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffccbb';
  ctx.beginPath(); ctx.arc(cx-4.8, cy-5.8, 2.0, 0, Math.PI*2); ctx.arc(cx+4.8, cy-5.8, 2.0, 0, Math.PI*2); ctx.fill();

  // шапка
  if(hasHat){
    ctx.fillStyle='#c62828';
    ctx.beginPath(); ctx.ellipse(cx, cy-7.5, 6.5, 3.8, 0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#b71c1c';
    ctx.fillRect(cx-6.5, cy-8, 13, 2.5);
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(cx, cy-11, 2.4, 0, Math.PI*2); ctx.fill();
    // помпон блик
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(cx-0.6, cy-11.5, 0.9, 0, Math.PI*2); ctx.fill();
  }

  // морда
  ctx.fillStyle='#ffe4c4';
  ctx.beginPath(); ctx.ellipse(cx, cy+2.8, 3.9, 3.2, 0,0,Math.PI*2); ctx.fill();

  // глаза (с морганием)
  const blink = (isPlayer && Math.floor(tnow/3000)%12===0) ? 0.15 : 1;
  const ox=DX[dir]*0.7, oy=DY[dir]*0.5;
  ctx.fillStyle='#222';
  ctx.beginPath();
  ctx.ellipse(cx-2.2+ox, cy+0.6+oy, 1.35, 1.35*blink, 0,0,Math.PI*2);
  ctx.ellipse(cx+2.2+ox, cy+0.6+oy, 1.35, 1.35*blink, 0,0,Math.PI*2);
  ctx.fill();
  // блики глаз
  if(blink > 0.5){
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(cx-1.9+ox, cy+0.3+oy, 0.45, 0, Math.PI*2);
    ctx.arc(cx+2.5+ox, cy+0.3+oy, 0.45, 0, Math.PI*2);
    ctx.fill();
  }

  // нос
  ctx.fillStyle='#c07050';
  ctx.beginPath(); ctx.arc(cx+ox*1.3, cy+3.5+oy, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,200,180,0.5)';
  ctx.beginPath(); ctx.arc(cx+ox*1.3-0.3, cy+3.3+oy, 0.45, 0, Math.PI*2); ctx.fill();

  // щёчки
  ctx.fillStyle='rgba(255,150,150,0.35)';
  ctx.beginPath(); ctx.arc(cx-3.5, cy+3.5, 1.6, 0, Math.PI*2); ctx.arc(cx+3.5, cy+3.5, 1.6, 0, Math.PI*2); ctx.fill();

  // лапки (анимация)
  if(isPlayer && player.moving){
    const paw = Math.sin(animPhase)*2.4;
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx-4.2, cy+6.2+paw, 2.2, 1.6, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+4.2, cy+6.2-paw, 2.2, 1.6, 0,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx-4, cy+6.5, 2, 1.4, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+4, cy+6.5, 2, 1.4, 0,0,Math.PI*2); ctx.fill();
  }
}

function loop(now){
  if(gameState==='play'){
    animPhase += 0.25;
    // Голод постепенно падает. Чем голоднее хомяк, тем медленнее движение.
    hungerTick++;
    if(hungerTick>=6){ hungerTick=0; hunger=Math.max(0,hunger-0.018); }
    foodCooldown--;
    if(foodCooldown<=0 && food.length<2){
      for(let tries=0;tries<25;tries++){
        const fx=2+Math.floor(Math.random()*(COLS-4));
        const fy=2+Math.floor(Math.random()*(ROWS-4));
        if(field[fy][fx]===EMPTY){
          const foods=[['🥕',28]];
          const f=foods[Math.floor(Math.random()*foods.length)];
          food.push({x:fx,y:fy,type:f[0],gain:f[1],life:900});
          break;
        }
      }
      foodCooldown=500+Math.random()*500;
    }
    for(let i=food.length-1;i>=0;i--){ if(--food[i].life<=0) food.splice(i,1); }
    updateUI();
    if(comboTimer>0){ comboTimer--; if(comboTimer<=0) combo=Math.max(1,combo-0.35); }
    if(active.freeze>0) active.freeze--;
    if(active.speed>0) active.speed--;
    if(active.shield>0) active.shield--;
    if(active.magnet>0) active.magnet--;
    updatePowerUI();

    for(let i=fillQueue.length-1;i>=0;i--){
      const f=fillQueue[i];
      if(f.delay>0) f.delay--;
      else { spawnParticles(f.x,f.y,theme.particle[0],1); fillQueue.splice(i,1); }
    }
    for(let i=powerups.length-1;i>=0;i--){ powerups[i].life--; if(powerups[i].life<=0) powerups.splice(i,1); }

    goldCoinCooldown--;
    if(goldCoinCooldown<=0 && goldCoins.length===0){
      for(let tries=0;tries<20;tries++){
        const gx=2+Math.floor(Math.random()*(COLS-4));
        const gy=2+Math.floor(Math.random()*(ROWS-4));
        if(field[gy][gx]===EMPTY){ goldCoins.push({x:gx,y:gy,life:500}); break; }
      }
      goldCoinCooldown=550+Math.random()*400;
    }
    for(let i=goldCoins.length-1;i>=0;i--){ goldCoins[i].life--; if(goldCoins[i].life<=0) goldCoins.splice(i,1); }

    if(mode==='speed'){
      timeLeft-=1/60;
      if(timeLeft<=0){ timeLeft=0; die('player'); }
      updateUI();
    }
    updateMagnet();
    updateChaos();

    const hungerSpeed = hunger<20 ? 0.78 : hunger<45 ? 0.9 : 1;
    const delay=BASE_DELAY/(active.speed>0?1.45:1)/hungerSpeed;
    if(now-lastMove>=delay){
      // Клавиатура в приоритете (после свайпа joyDir мог «залипнуть»)
      let dir = -1;
      if(keys['ArrowRight']||keys['d']||keys['D']||keys['KeyD']||keys['в']||keys['В']) dir=0;
      else if(keys['ArrowDown']||keys['s']||keys['S']||keys['KeyS']||keys['ы']||keys['Ы']) dir=1;
      else if(keys['ArrowLeft']||keys['a']||keys['A']||keys['KeyA']||keys['ф']||keys['Ф']) dir=2;
      else if(keys['ArrowUp']||keys['w']||keys['W']||keys['KeyW']||keys['ц']||keys['Ц']) dir=3;
      if(dir < 0 && joyDir >= 0) dir = joyDir;
      updateModeUI();

      if(dir!==-1){
        tryMove(dir,'player');
        if(mode==='mirror' && mirrorPlayer){
          const mdir = dir===0?2:dir===2?0:dir===1?3:1;
          tryMove(mdir,'mirror');
        }
      } else {
        player.moving=false;
      }
      lastMove=now;
    }
    moveEnemies();
    if(mode==='duel') updateBot();
  }
  draw();
  requestAnimationFrame(loop);
}

// Управление с клавиатуры
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.code) keys[e.code]=true;
  // сброс залипшего свайпа при нажатии клавиш
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyR'].includes(e.code) ||
     ['w','a','s','d','W','A','S','D'].includes(e.key)) joyDir = -1;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key) ||
     ['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
  if(e.key===' ' && gameState==='play') showPause();
  if((e.key==='r'||e.key==='R'||e.code==='KeyR')&&(gameState==='play'||gameState==='pause')){
    resetLevel(); gameState='play'; setMenuMode(false); document.getElementById('overlay').classList.add('hidden');
  }
});
window.addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(e.code) keys[e.code]=false;
});

// Управление кнопками D-Pad
document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const set = (on)=>{
    if(on){ joyDir=+btn.dataset.dir; btn.classList.add('active'); }
    else { if(joyDir===+btn.dataset.dir) joyDir=-1; btn.classList.remove('active'); }
  };
  btn.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); set(true); },{passive:false});
  btn.addEventListener('touchend',e=>{ e.preventDefault(); set(false); },{passive:false});
  btn.addEventListener('mousedown',e=>{ initAudio(); set(true); });
  btn.addEventListener('mouseup',()=>set(false));
  btn.addEventListener('mouseleave',()=>set(false));
});

// Управление свайпами по экрану / холсту
let touchStartX = 0, touchStartY = 0;
const gameContainer = document.getElementById('gameWrapper');

gameContainer.addEventListener('touchstart', e => {
  initAudio();
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

gameContainer.addEventListener('touchend', e => {
  if (e.changedTouches.length === 1) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const minSwipeDist = 20;

    if (Math.abs(dx) > minSwipeDist || Math.abs(dy) > minSwipeDist) {
      // Свайп — едет пока не остановишь тапом
      if (Math.abs(dx) > Math.abs(dy)) joyDir = dx > 0 ? 0 : 2;
      else joyDir = dy > 0 ? 1 : 3;
      swipeGuard = performance.now();
    } else {
      // Короткий тап по полю — стоп
      joyDir = -1;
      player.moving = false;
    }
  }
}, { passive: true });

// Клик / тап по полю (без свайпа обрабатывается выше) — стоп на ПК
gameContainer.addEventListener('click', e=>{
  if(gameState!=='play') return;
  // не стопаем если клик по кнопкам UI
  if(e.target.closest && (e.target.closest('.icon-btn')||e.target.closest('#overlay'))) return;
  // если только что был свайп — не считаем кликом (touch devices fire click after swipe)
  // короткая защита: стоп только если нет зажатых клавиш направления
  const keyMoving = keys['ArrowRight']||keys['ArrowLeft']||keys['ArrowUp']||keys['ArrowDown']||
    keys['w']||keys['a']||keys['s']||keys['d']||keys['W']||keys['A']||keys['S']||keys['D']||
    keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD'];
  if(performance.now() - swipeGuard < 350) return; // после свайпа не стопать
  if(!keyMoving){
    joyDir = -1;
    player.moving = false;
  }
});


document.getElementById('musicBtn').onclick=()=>{
  musicOn=!musicOn;
  localStorage.setItem('hamster_music', musicOn?'1':'0');
  document.getElementById('musicBtn').textContent = musicOn?'🎵':'🚫';
  if(musicOn) startMusic(); else stopMusic();
};
document.getElementById('musicBtn').textContent = musicOn?'🎵':'🚫';

document.getElementById('soundBtn').onclick=()=>{
  soundOn=!soundOn;
  localStorage.setItem('hamster_sound', soundOn?'1':'0');
  document.getElementById('soundBtn').textContent = soundOn?'🔊':'🔇';
  if(soundOn) initAudio();
};
document.getElementById('soundBtn').textContent = soundOn?'🔊':'🔇';

document.getElementById('pauseBtn').onclick = () => {
  if (gameState === 'play') showPause();
  else if (gameState === 'pause') {
    gameState = 'play';
    document.getElementById('overlay').classList.add('hidden');
  }
};

// Инициализация
// Главное меню всегда строится одной функцией — никаких двух разных версий меню.
window.addEventListener('resize', ()=>{
  applyExpandField();
  applyControlLayout();
  if(gameState==='play') draw();
});
document.addEventListener('fullscreenchange', ()=>{
  requestAnimationFrame(()=>{
    applyExpandField();
    applyControlLayout();
    if(gameState==='play') draw();
  });
});
applyControlLayout();
applyExpandField();
applyHideControls();
/* highscore removed */
initField();
showMainMenu();
draw();

// PWA: офлайн через sw.js (файл должен лежать рядом на GitHub Pages)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      console.log('[PWA] SW ok', reg.scope);
    }).catch((err) => {
